name: Build and push Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Roda apenas no repo de produção (Leonardo-almd/minutor-frontend).
    # No repo homolog (ricardooliveiraerpserv/minutor-frontend-homolog) o
    # workflow é ignorado — Render builda e roda automaticamente.
    if: github.repository == 'Leonardo-almd/minutor-frontend'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.minutor.com.br
            BACKEND_URL=http://backend:8080
          tags: |
            ghcr.io/leonardo-almd/minutor-frontend:latest
            ghcr.io/leonardo-almd/minutor-frontend:${{ github.sha }}
          cache-from: type=gha,scope=v2
          cache-to: type=gha,mode=max,scope=v2
